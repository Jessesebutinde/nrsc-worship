<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#4B2A8A" media="(prefers-color-scheme: light)" />
<meta name="theme-color" content="#16121D" media="(prefers-color-scheme: dark)" />
<title>Set list · NRSC Worship</title>
<link rel="manifest" href="/manifest.webmanifest" />
<link rel="icon" href="/icon.svg" type="image/svg+xml" />
<link rel="stylesheet" href="/app.css?v=1" />
<script src="/shared.js?v=1" defer></script>
<script src="/ui.js?v=1" defer></script>
</head>
<body>
<main>
  <a class="back" href="/sets.html">← All set lists</a>
  <div id="msg"></div>
  <div id="set" class="stack"><div class="skeleton"></div><div class="skeleton" style="height:220px"></div></div>
</main>

<script>
document.addEventListener('DOMContentLoaded', function () {
  var W = NRSCWorship, esc = UI.esc, $ = UI.$;
  UI.header('sets');
  var id = Number(new URLSearchParams(location.search).get('id'));
  if (!id) { $('#set').innerHTML = UI.errorHtml({ message: 'No set list chosen.' }); return; }

  function section(set, key) {
    var items = set.items.filter(function (i) { return i.section === key; });
    if (!items.length) return '';
    return '<h2>' + W.SESSIONS[key] + ' <span class="n">' + items.length + '</span></h2><ol class="setlist">' +
      items.map(function (i) {
        return '<li><div class="grow"><a href="/song.html?id=' + i.song.id + '">' + esc(i.song.title) + '</a>' +
          (i.song.title_alt ? '<div class="small muted">' + esc(i.song.title_alt) + '</div>' : '') + '</div>' +
          (i.song.song_key ? '<span class="badge key">' + esc(i.song.song_key) + '</span>' : '') + '</li>';
      }).join('') + '</ol>';
  }

  function render(set) {
    document.title = W.formatDate(set.service_date, true) + ' · NRSC Worship';
    var link = location.origin + '/set.html?id=' + set.id;
    var text = W.shareText(set, link);
    $('#set').innerHTML =
      '<div class="set-head"><div class="date">' + esc(W.formatDate(set.service_date)) + '</div>' +
        '<h1>' + esc(set.title || (set.theme ? set.theme.name : 'Service')) + '</h1>' +
        '<div class="badges">' + (set.theme && set.title ? '<a class="badge praise" style="text-decoration:none" href="/?theme=' + set.theme.id + '">Theme: ' + esc(set.theme.name) + '</a>' : '') +
        (set.leader_name ? '<span class="badge key">Leading: ' + esc(set.leader_name) + '</span>' : '') + '</div></div>' +
      (set.notes ? '<div class="card" style="white-space:pre-wrap">' + esc(set.notes) + '</div>' : '') +
      (set.items.length ? section(set, 'praise') + section(set, 'worship') : '<div class="none">No songs in this set list yet.</div>') +
      '<div class="sticky-actions"><a class="btn wa grow" id="wa" href="' + esc(W.whatsappUrl(text)) + '" target="_blank" rel="noopener">' +
        '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm0 18.2a8.2 8.2 0 0 1-4.2-1.1l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.2zm4.5-6.1c-.2-.1-1.5-.7-1.7-.8s-.4-.1-.6.1-.7.8-.8 1-.3.2-.5.1a6.7 6.7 0 0 1-3.3-2.9c-.2-.4.2-.4.7-1.3.1-.2 0-.3 0-.4l-.8-1.8c-.2-.5-.4-.4-.6-.4h-.5a1 1 0 0 0-.7.3 3 3 0 0 0-.9 2.2 5.2 5.2 0 0 0 1.1 2.7 11.9 11.9 0 0 0 4.6 4c1.7.7 2.4.8 3.2.7a2.8 2.8 0 0 0 1.8-1.3 2.3 2.3 0 0 0 .2-1.3c-.1-.1-.2-.2-.5-.3z"/></svg>' +
        'Share to WhatsApp</a><button class="btn quiet" id="copy">Copy</button></div>' +
      (UI.pin.get() ? '<p class="small"><a href="/admin.html#set/' + set.id + '">Edit this set list</a></p>' : '');
    $('#copy').onclick = async function () {
      try { await navigator.clipboard.writeText(text); UI.toast('Copied — paste it in the WhatsApp group'); }
      catch (e) { window.prompt('Copy this text', text); }
    };
  }

  UI.cached('nw.set.' + id, '/api/sets?id=' + id, function (d) { $('#msg').innerHTML = ''; render(d.set); },
    function (e) { $('#set').innerHTML = ''; $('#msg').innerHTML = UI.errorHtml(e); });
});
</script>
</body>
</html>
