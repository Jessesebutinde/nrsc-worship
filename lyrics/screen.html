<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Lyric Slides · Screen</title>
    <meta name="theme-color" content="#0e0b14" />
    <link rel="icon" href="icon.svg" type="image/svg+xml" />
    <link rel="preload" href="fonts/montserrat-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="stage.css?v=6a11d4e2" />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #000;
        overflow: hidden;
      }
      #app {
        height: 100%;
      }
      .screen {
        position: fixed;
        inset: 0;
        background: #000;
        font-family: 'Montserrat', system-ui, sans-serif;
        color: #f5f3ee;
      }
      .screen.clear-bg,
      html:has(.clear-bg),
      html:has(.clear-bg) body {
        background: transparent;
      }
      .screen.idle {
        cursor: none;
      }
      .pair {
        position: absolute;
        right: 3vw;
        bottom: 4vh;
        display: flex;
        align-items: center;
        gap: 1.6vw;
        padding: 1.2vw 1.6vw;
        border-radius: 1vw;
        background: rgba(14, 11, 20, 0.72);
        border: 1px solid rgba(227, 183, 90, 0.35);
        animation: ls-fade-in 600ms ease both;
      }
      .pair-code {
        font-size: 3.2vw;
        font-weight: 700;
        letter-spacing: 0.12em;
        color: #e3b75a;
        white-space: nowrap;
      }
      .pair-text {
        font-size: 1.15vw;
        line-height: 1.4;
        max-width: 26vw;
        opacity: 0.85;
      }
      .pair-text b {
        font-weight: 600;
        overflow-wrap: anywhere;
      }
      /* Which output this window is, for a few seconds after the laptop opens it. */
      .badge {
        position: absolute;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 0.6vw;
        padding: 2vw 3.5vw;
        border-radius: 1.5vw;
        background: rgba(14, 11, 20, 0.85);
        border: 0.25vw solid #e3b75a;
        animation: ls-fade-in 300ms ease both;
        pointer-events: none;
      }
      .badge b {
        font-size: 5vw;
        font-weight: 700;
        letter-spacing: 0.12em;
        color: #e3b75a;
      }
      .badge.stream b {
        color: #7fd9bf;
      }
      .badge.stream {
        border-color: #7fd9bf;
      }
      .badge span {
        font-size: 1.6vw;
        opacity: 0.85;
      }
      .hint,
      .offline {
        position: absolute;
        left: 50%;
        transform: translateX(-50%);
        top: 2vh;
        padding: 0.5vw 1vw;
        border-radius: 99px;
        background: rgba(0, 0, 0, 0.6);
        font-size: 0.9vw;
        white-space: nowrap;
        opacity: 0.85;
      }
      .offline {
        top: auto;
        bottom: 1vh;
        left: 1vw;
        transform: none;
        color: #e3b75a;
      }
      noscript {
        color: #fff;
      }
    </style>
  </head>
  <body>
    <div id="app"><noscript>The screen needs JavaScript.</noscript></div>
    <script type="module" src="../src/lyrics/screen.js?v=6a11d4e2"></script>
  </body>
</html>
